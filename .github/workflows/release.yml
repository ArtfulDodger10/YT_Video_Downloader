name: Release

# Push a tag like v2.1.0 (matching ytdown/__init__.py) to build and publish a Windows release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -e .[dev]

      - name: Check that the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = python -c "import ytdown; print(ytdown.__version__)"
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match version $v" }

      - name: Test
        run: pytest

      - name: Download FFmpeg (LGPL build)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-dl
          $bin = (Get-ChildItem ffmpeg-dl -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          "FFMPEG_BIN=$bin" >> $env:GITHUB_ENV

      - name: Build
        shell: pwsh
        run: ./build.ps1 -WithFfmpeg $env:FFMPEG_BIN -Zip

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist/*.zip | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Out-File dist/SHA256SUMS.txt -Encoding ascii

      - name: Release title and notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          # Title = the annotated tag's message (git tag -a v2.1.0 -m "YTDown 2.1.0 - ...")
          git fetch --force --depth=1 origin "refs/tags/${tag}:refs/tags/${tag}"
          $title = (git tag -l --format='%(contents:subject)' $tag).Trim()
          if (-not $title) { $title = "YTDown $($tag.TrimStart('v'))" }
          "RELEASE_TITLE=$title" >> $env:GITHUB_ENV
          # Notes = this version's section of CHANGELOG.md
          $ver = [regex]::Escape($tag.TrimStart('v'))
          $log = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($log, "(?ms)^## \[$ver\][^\n]*\n(.*?)(?=^## \[|\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "See CHANGELOG.md" }
          $notes += "`n`n---`n**Download:** ``YTDown-$($tag.TrimStart('v'))-windows-x64.zip`` below, unzip and run ``YTDown.exe`` (FFmpeg included). "
          $notes += "For full YouTube quality also install Deno (the app offers a one-click install). "
          $notes += "Windows may show a SmartScreen prompt because the app isn't code-signed: *More info > Run anyway*. "
          $notes += "Verify the download with ``SHA256SUMS.txt``."
          Set-Content release-notes.md $notes -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: YTDown-windows
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ env.RELEASE_TITLE }}
          body_path: release-notes.md
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
